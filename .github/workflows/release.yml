name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded UI
        working-directory: web
        run: npm ci && npm run build

      - name: Stage UI for go:embed
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -a web/dist/. internal/webui/dist/

      - name: Build static binary and sample plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/replacearr ./cmd/replacearr
          go build -ldflags="-s -w" -o dist/sample-indexer ./examples/plugins/sample-indexer
          tar -C dist -czf replacearr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz replacearr sample-indexer

      - uses: actions/upload-artifact@v6
        with:
          name: replacearr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: replacearr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  publish:
    name: GitHub release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
