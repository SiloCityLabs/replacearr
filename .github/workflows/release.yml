name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded UI
        working-directory: web
        run: npm ci && npm run build

      - name: Stage UI for go:embed
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -a web/dist/. internal/webui/dist/

      - name: Resolve version from VERSION file
        id: ver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION file ($VERSION)" >&2
              exit 1
            fi
          fi

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          COMMIT="${GITHUB_SHA::7}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" \
            -o dist/replacearr ./cmd/replacearr
          tar -C dist -czf replacearr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz replacearr

      - uses: actions/upload-artifact@v6
        with:
          name: replacearr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: replacearr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  publish:
    name: GitHub release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  dockerhub:
    name: Docker Hub
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker-hub.yml
    with:
      tag: ${{ github.ref_name }}
      push_latest: true
    secrets: inherit
