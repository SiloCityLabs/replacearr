name: Docker Hub

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag (with or without v prefix; e.g. 0.3.0 or v0.3.0)
        required: true
        type: string
      push_latest:
        description: Also push the latest tag
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Primary image tag (e.g. 0.3.0 or latest)
        required: false
        default: latest
        type: string
      push_latest:
        description: Also push latest (ignored when primary tag is already latest)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  image:
    name: Build and publish to Docker Hub
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags
        id: ver
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          RAW="${{ inputs.tag }}"
          TAG="${RAW#v}"
          if [[ -z "$TAG" ]]; then
            echo "Image tag is empty" >&2
            exit 1
          fi
          if [[ "$TAG" != "latest" && "$TAG" != "$FILE_VERSION" ]]; then
            echo "Image tag ${TAG} does not match VERSION file (${FILE_VERSION})" >&2
            exit 1
          fi
          IMAGE_VERSION="$TAG"
          if [[ "$TAG" == "latest" ]]; then
            IMAGE_VERSION="$FILE_VERSION"
          fi

          PUSH_LATEST="${{ inputs.push_latest }}"
          {
            echo "tag=${TAG}"
            echo "version=${IMAGE_VERSION}"
            echo "tags<<EOF"
            echo "docker.io/ldrrp/replacearr:${TAG}"
            if [[ "$PUSH_LATEST" == "true" && "$TAG" != "latest" ]]; then
              echo "docker.io/ldrrp/replacearr:latest"
            fi
            echo "docker.io/ldrrp/replacearr:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ldrrp
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ldrrp
          password: ${{ secrets.DOCKER_HUB_KEY }}
          repository: ldrrp/replacearr
          readme-filepath: ./docker/README.md
          short-description: Single-binary Sonarr, Radarr, and Prowlarr replacement
          enable-url-completion: true
