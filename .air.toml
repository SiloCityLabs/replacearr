# Air live-reload for local Docker development (root Dockerfile / entrypoint.sh).
# Production images do not include Air — see docker/Dockerfile.
#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  # Static binary matching production build flags (no CGO).
  # Version comes from the root VERSION file (same source as Makefile / docker/Dockerfile).
  cmd = "CGO_ENABLED=0 go build -buildvcs=false -ldflags=\"-s -w -X main.Version=$(tr -d '[:space:]' < VERSION) -X main.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo dev) -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)\" -o ./tmp/replacearr ./cmd/replacearr"
  entrypoint = ["./tmp/replacearr"]
  # Always free :REPLACEARR_PORT (and any stale tmp/replacearr) before exec.
  # Air sometimes loses track of children after failed builds, leaving a deleted
  # inode process bound to :8989 and every subsequent start fails with EADDRINUSE.
  full_bin = "bash ./scripts/dev-run-api.sh ./tmp/replacearr"
  include_ext = ["go", "sql"]
  exclude_dir = [
    ".git",
    ".github",
    ".cursor",
    "tmp",
    "vendor",
    "bin",
    "web",
    "config",
    "data",
    "definitions",
    "docs",
    "docker",
    "scripts",
    "internal/webui/dist",
    "node_modules",
  ]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  log = "air.log"
  # Bind mounts often miss inotify events; poll so host edits always rebuild.
  poll = true
  poll_interval = 500
  delay = 800
  # Keep the previous binary running until a new build succeeds; Air itself
  # keeps watching after compile errors so fixing the error triggers another build.
  stop_on_error = false
  # Graceful SIGINT first (main.shuts down http.Server), then hard kill.
  send_interrupt = true
  kill_delay = "3s"

[log]
  time = false
  main_only = false
  silent = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
