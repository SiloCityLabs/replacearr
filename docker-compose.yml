# ==============================================================================
# Replacearr — local containerized development
#
# Root = development. Production lives under docker/.
#
#   make start
#   # or: docker compose up --build
#
# UI (Vite HMR):  http://localhost:5173
# API:            http://localhost:8989
#
# Path layout matches production: /config, /data/TV, /data/Movies, /data/Music, /data/Books, /data/Audiobooks, /data/downloads
# ==============================================================================

services:
  replacearr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replacearr-dev
    working_dir: /workspace
    environment:
      - REPLACEARR_HOST=0.0.0.0
      - REPLACEARR_PORT=8989
      - REPLACEARR_CONFIG_DIR=/config
      - REPLACEARR_PLUGIN_DIR=/workspace/bin/plugins
      - REPLACEARR_DEFINITIONS_DIR=/config/definitions
      - REPLACEARR_ADMIN_USER=admin
      - REPLACEARR_ADMIN_PASS=replacearr
      - REPLACEARR_FLARESOLVERR_URL=http://flaresolverr:8191/
      - REPLACEARR_ENV=development
      - TZ=UTC
      - GOFLAGS=-buildvcs=false
      - GOCACHE=/go-cache/build
      - GOMODCACHE=/go-cache/mod
    ports:
      - "8989:8989"
      - "5173:5173"
    volumes:
      - .:/workspace
      - ./config:/config
      - ./data:/data
      - replacearr-go-cache:/go-cache
      - replacearr-web-node-modules:/workspace/web/node_modules
    depends_on:
      - flaresolverr
    command: ["./entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    stdin_open: true
    tty: true
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: replacearr-flaresolverr-dev
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=UTC
    tmpfs:
      - /tmp:size=256M,mode=1777
    restart: unless-stopped

  # qbittorrent:
  #   image: lscr.io/linuxserver/qbittorrent:latest
  #   container_name: replacearr-qbittorrent-dev
  #   environment:
  #     - PUID=1000
